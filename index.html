<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Tabel perkalian</h2>

    <label for="angka">Masukan angka</label>
    <input type="number" id="angka" placeholder="contoh: 7">

    <label for="batas">sampai lipatan ke-:</label>
    <input type="number" id="batas" placeholder="contoh: 12">

    <button onclick="buatTabel()">Tampilkan</button>

    <p id="hasil"></p>


    <script>

        function buatTabel() {
            let angka = Number(document.getElementById("angka").value);
            let teks = "";

            const hasil = document.getElementById("hasil");
            let input = document.getElementById("angka").value;

            if (input === "") {
                hasil.innerHTML = "Masukan angka terlebih dahulu!";
                return;
            }


            let batas = Number(document.getElementById("batas").value);

            for (let i = 1; i <= batas; i++) {
                teks +=angka + "x" + i + "=" + (angka * i) + "<br>";
            }
            
             document.getElementById("hasil").innerHTML = teks;

        }

        function faktorial(n) {
            let hasil = 1;

            for (let i = 2; i <=n; i++) {
             hasil *= i;
            }
            return hasil;
        }
        console.log(faktorial(5));


    </script>
    
    
    
</body>
</html>
